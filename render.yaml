services:
  - type: web
    name: ripplelens
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: H2_CONSOLE_ENABLED
        value: "false"
      - key: DATABASE_URL
        fromDatabase:
          name: ripplelens-db
          property: connectionString
      - key: SPRING_DATASOURCE_USERNAME
        fromDatabase:
          name: ripplelens-db
          property: user
      - key: SPRING_DATASOURCE_PASSWORD
        fromDatabase:
          name: ripplelens-db
          property: password
      - key: SECURITY_AUDIT_KEY
        generateValue: true
      - key: APP_BASE_URL
        value: https://ripplelens.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://ripplelens.onrender.com
      - key: PASSWORD_RESET_DELIVERY_ENABLED
        value: "false"
      - key: PASSWORD_RESET_PROVIDER
        value: resend
      - key: PASSWORD_RESET_FROM_ADDRESS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: METALS_DEV_API_KEY
        sync: false

databases:
  - name: ripplelens-db
    plan: free
    region: oregon
    postgresMajorVersion: "18"
    databaseName: ripplelens
    user: ripplelens_app
    ipAllowList: []
