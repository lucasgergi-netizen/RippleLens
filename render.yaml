services:
  - type: web
    name: ripplelens
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: H2_CONSOLE_ENABLED
        value: "false"
      - key: OPENAI_API_KEY
        sync: false
      - key: NEWS_API_KEY
        sync: false
      - key: METALS_DEV_API_KEY
        sync: false
