# Copy this file to config/ripplelens-secrets.properties and paste your real keys.
# The real ripplelens-secrets.properties file is ignored by Git so your keys stay local.

# Metals.Dev enables real historical metals data for gold, silver, copper, platinum, and palladium.
METALS_DEV_API_KEY=replace_with_your_metals_dev_key

# OpenAI enables AI-assisted market explanations.
OPENAI_API_KEY=replace_with_your_openai_key

# NewsAPI.org enables 5 real related news headlines per selected asset.
NEWS_API_KEY=replace_with_your_newsapi_key
