spring.datasource.url=jdbc:h2:mem:ripplelens-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
spring.flyway.enabled=true
ripplelens.security.password-reset.delivery-enabled=false
ripplelens.security.cors.allowed-origins=https://trusted.security.example
