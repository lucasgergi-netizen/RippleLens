spring.application.name=RippleLens
server.port=${PORT:8080}
spring.config.import=optional:file:./config/ripplelens-secrets.properties
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/ripplelens;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
openai.enabled=true
openai.api-key=${OPENAI_API_KEY:}
openai.model=gpt-5.1
openai.timeout-seconds=20
newsapi.api-key=${NEWS_API_KEY:}
# Optional: add a Metals.Dev key to replace fallback metal chart history with real historical metal observations.
ripplelens.metals-dev.api-key=${METALS_DEV_API_KEY:}
ripplelens.live.tick-ms=60000
ripplelens.live.initial-delay-ms=5000
ripplelens.live.real-refresh-ms=60000
