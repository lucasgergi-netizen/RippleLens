spring.application.name=RippleLens
server.port=${PORT:8080}
spring.config.import=optional:file:./config/ripplelens-secrets.properties
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/ripplelens;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.flyway.enabled=${FLYWAY_ENABLED:false}
server.servlet.session.timeout=${SESSION_TIMEOUT:30m}
server.servlet.session.tracking-modes=cookie
server.max-http-request-header-size=16KB
server.tomcat.max-http-form-post-size=64KB
server.tomcat.max-swallow-size=1MB
spring.servlet.multipart.enabled=false
server.shutdown=graceful
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
ripplelens.security.require-https=${REQUIRE_HTTPS:false}
ripplelens.security.audit-key=${SECURITY_AUDIT_KEY:local-development-audit-key-change-me}
ripplelens.security.application-base-url=${APP_BASE_URL:http://localhost:8080}
ripplelens.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
ripplelens.security.password-reset.delivery-enabled=${PASSWORD_RESET_DELIVERY_ENABLED:false}
ripplelens.security.password-reset.provider=${PASSWORD_RESET_PROVIDER:none}
ripplelens.security.password-reset.from-address=${PASSWORD_RESET_FROM_ADDRESS:}
ripplelens.security.password-reset.resend-api-key=${RESEND_API_KEY:}
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
openai.enabled=true
openai.api-key=${OPENAI_API_KEY:}
openai.model=gpt-5.1
openai.timeout-seconds=20
newsapi.api-key=${NEWS_API_KEY:}
# Optional: add a Metals.Dev key to replace fallback metal chart history with real historical metal observations.
ripplelens.metals-dev.api-key=${METALS_DEV_API_KEY:}
ripplelens.live.tick-ms=60000
ripplelens.live.initial-delay-ms=5000
ripplelens.live.real-refresh-ms=60000
