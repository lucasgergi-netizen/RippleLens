spring.h2.console.enabled=false
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:false}
spring.flyway.baseline-version=1
spring.flyway.validate-on-migrate=true
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:1}
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.max-lifetime=1500000
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.name=__Host-RIPPLELENS_SESSION
server.servlet.session.cookie.path=/
server.servlet.session.timeout=30m
server.forward-headers-strategy=native
ripplelens.security.require-https=true
ripplelens.security.audit-key=${SECURITY_AUDIT_KEY:}
ripplelens.security.application-base-url=${APP_BASE_URL:https://ripplelens.onrender.com}
ripplelens.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://ripplelens.onrender.com}
ripplelens.security.password-reset.delivery-enabled=${PASSWORD_RESET_DELIVERY_ENABLED:false}
ripplelens.security.password-reset.provider=${PASSWORD_RESET_PROVIDER:none}
ripplelens.security.password-reset.from-address=${PASSWORD_RESET_FROM_ADDRESS:}
ripplelens.security.password-reset.resend-api-key=${RESEND_API_KEY:}
logging.level.org.springframework.security=WARN
logging.level.org.hibernate.SQL=OFF
